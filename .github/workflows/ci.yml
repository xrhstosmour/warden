name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Lint
        run: shellcheck -x -S style install.sh provision.sh keys.sh library/*.sh modules/*.sh files/*.sh tests/integration/*.sh
      - name: Syntax
        run: for file in install.sh provision.sh keys.sh library/*.sh modules/*.sh; do bash -n "$file"; done

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install bats
        run: sudo apt-get update -q && sudo apt-get install -y -q bats
      - name: Test
        run: bats tests/

  integration:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The runner's kernel does not load it, and rootless Docker refuses to
      # start its bridge network without it. The container shares this kernel.
      - name: Load the bridge netfilter module
        run: sudo modprobe br_netfilter
      - name: Run warden twice in Debian 13
        run: tests/integration/run.sh
