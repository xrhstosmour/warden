# Managed by warden, local changes are overwritten on the next run.

# Network, refuse redirects, spoofed sources and source routing.
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_rfc1337 = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Kernel, hide addresses and logs from unprivileged users, close the
# interfaces exploits lean on most.
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
kernel.printk = 3 3 3 3
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
kernel.kexec_load_disabled = 1
kernel.sysrq = 0
kernel.perf_event_paranoid = 3
kernel.yama.ptrace_scope = 2
dev.tty.ldisc_autoload = 0

# File system, no following links or writing files planted by someone else
# in a shared directory, and no core dumps from privileged programs.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0

# Unprivileged user namespaces stay enabled, rootless Docker is built on
# them. Turning them off here would stop every container.

# Rootless Docker publishes 80 and 443 from the deploy user. Only the
# admin and deploy users can log in, so letting users bind from 80 opens
# nothing to anyone else.
net.ipv4.ip_unprivileged_port_start = 80

# Performance, BBR with fair queueing for throughput and latency to
# clients on lossy mobile networks, and deeper accept queues for bursts.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 8192
net.ipv4.tcp_slow_start_after_idle = 0

# Memory, swap only under real pressure. Redis forks to save, and refuses
# to without overcommit.
vm.swappiness = 10
vm.overcommit_memory = 1
