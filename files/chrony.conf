# Managed by warden, local changes are overwritten on the next run.
#
# Only Network Time Security sources, so every time sample is
# authenticated. Four independent operators, so one going away or going
# wrong is outvoted.
server time.cloudflare.com iburst nts
server nts.netnod.se iburst nts
server ptbtime1.ptb.de iburst nts
server ntppool1.time.nl iburst nts

# Refuse to start trusting a source until three agree.
minsources 3

# NTS cookies and keys, kept across restarts.
ntsdumpdir /var/lib/chrony

# Step the clock on boot if it is far off, slew it afterwards.
makestep 1 3
rtcsync

driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony
maxupdateskew 100.0
leapsectz right/UTC

# Serve no clients and take no commands from the network.
cmdport 0
